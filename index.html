<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Rater Pro</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00b894;
            --bg: #f0f2f5;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        /* Gemeinsame Card-Styles */
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: fit-content;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: #333; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }

        /* LEADERBOARD (Links) */
        #leaderboard-list { list-style: none; padding: 0; }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        .rank { font-weight: bold; color: var(--primary); margin-right: 10px; }

        /* RATING AREA (Mitte) */
        .rating-display { text-align: center; }
        #item-image { width: 100%; height: 350px; object-fit: cover; border-radius: 10px; background: #eee; }
        .controls { display: flex; align-items: center; gap: 15px; margin-top: 20px; }
        .slider-box { flex-grow: 1; }
        input[type=range] { width: 100%; }
        button { 
            cursor: pointer; border: none; border-radius: 8px; padding: 12px;
            font-weight: bold; transition: 0.2s;
        }
        #submit-rating { background: var(--secondary); color: white; }

        /* UPLOAD AREA (Rechts) */
        #drop-zone {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        #drop-zone.hover { border-color: var(--primary); background: #f8f8ff; }
        #preview-img { width: 100%; display: none; margin-top: 10px; border-radius: 5px; }
        input[type="text"] {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;
        }
        #upload-btn { background: var(--primary); color: white; width: 100%; }

        @media (max-width: 1000px) {
            .main-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="card">
        <h2>Top 10 Leaderboard</h2>
        <div id="leaderboard-list">Lade Ranking...</div>
    </div>

    <div class="card rating-display">
        <h2 id="current-item-name">Warte auf Content...</h2>
        <img id="item-image" src="" alt="Lade Bild...">
        <div class="controls">
            <div class="slider-box">
                <input type="range" id="rating-slider" min="1" max="10" value="5">
                <div style="display:flex; justify-content:space-between; font-size: 0.8rem;">
                    <span>1</span> <span id="rating-val">Wert: 5</span> <span>10</span>
                </div>
            </div>
            <button id="submit-rating">Voten</button>
        </div>
    </div>

    <div class="card">
        <h2>Neues Item hinzufügen</h2>
        <div id="drop-zone">
            Bild hierher ziehen oder klicken
            <input type="file" id="file-input" hidden accept="image/*">
            <img id="preview-img" alt="Vorschau">
        </div>
        <input type="text" id="new-item-name" placeholder="Was ist das?">
        <button id="upload-btn">Hochladen & Teilen</button>
        <p id="upload-status" style="font-size: 0.8rem; color: #666;"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, setDoc, increment, onSnapshot, query, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // DEINE CONFIG HIER
    const firebaseConfig = {
        apiKey: "AIzaSyDzoZamebiQdgTzytRcx57VmoyLDHdgHaQ",
        authDomain: "randombewertungen.firebaseapp.com",
        projectId: "randombewertungen",
        storageBucket: "randombewertungen.firebasestorage.app",
        messagingSenderId: "747722741918",
        appId: "1:747722741918:web:35cacdc04cad73adaf838f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let allItems = [];
    let currentItemIndex = 0;
    let selectedFile = null;

    // --- LOGIK: ITEMS LADEN & BEWERTEN ---

    async function loadItems() {
        const querySnapshot = await getDocs(collection(db, "items"));
        allItems = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        // Mische die Liste zufällig
        allItems.sort(() => Math.random() - 0.5);
        showNextItem();
    }

    function showNextItem() {
        if (currentItemIndex < allItems.length) {
            const item = allItems[currentItemIndex];
            document.getElementById('current-item-name').textContent = item.name;
            document.getElementById('item-image').src = item.url;
            document.getElementById('rating-slider').value = 5;
            document.getElementById('rating-val').textContent = "Wert: 5";
        } else {
            document.getElementById('current-item-name').textContent = "Alles bewertet! Lade neue hoch.";
            document.getElementById('item-image').src = "https://via.placeholder.com/400?text=Fertig";
        }
    }

    document.getElementById('rating-slider').oninput = (e) => {
        document.getElementById('rating-val').textContent = `Wert: ${e.target.value}`;
    };

    document.getElementById('submit-rating').onclick = async () => {
        if (currentItemIndex >= allItems.length) return;
        
        const item = allItems[currentItemIndex];
        const val = parseInt(document.getElementById('rating-slider').value);
        
        const statsRef = doc(db, "stats", item.id);
        await setDoc(statsRef, {
            name: item.name,
            count: increment(1),
            totalRating: increment(val)
        }, { merge: true });

        currentItemIndex++;
        showNextItem();
    };

    // --- LOGIK: LEADERBOARD (Live-Update) ---

    onSnapshot(collection(db, "stats"), (snapshot) => {
        let stats = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            const avg = data.count > 0 ? (data.totalRating / data.count).toFixed(1) : 0;
            stats.push({ ...data, avg: parseFloat(avg) });
        });

        // Sortiere nach Durchschnitt, dann nach Anzahl der Stimmen
        stats.sort((a, b) => b.avg - a.avg || b.count - a.count);

        const listEl = document.getElementById('leaderboard-list');
        listEl.innerHTML = stats.slice(0, 10).map((s, i) => `
            <div class="leaderboard-item">
                <span><span class="rank">#${i+1}</span> ${s.name}</span>
                <span style="color:var(--secondary); font-weight:bold">${s.avg} ★</span>
            </div>
        `).join('');
    });

    // --- LOGIK: UPLOAD ---

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('hover');
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        handleFile(e.dataTransfer.files[0]);
    };
    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('preview-img');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('upload-btn').onclick = async () => {
        const name = document.getElementById('new-item-name').value;
        const status = document.getElementById('upload-status');

        if (!selectedFile || !name) {
            alert("Bitte Bild wählen und Namen eingeben!");
            return;
        }

        status.textContent = "Lade hoch...";
        try {
            // 1. Bild in Storage laden
            const storageRef = ref(storage, 'items/' + Date.now() + "_" + selectedFile.name);
            const snapshot = await uploadBytes(storageRef, selectedFile);
            const downloadURL = await getDownloadURL(snapshot.ref);

            // 2. Dokument in Firestore "items" erstellen
            await addDoc(collection(db, "items"), {
                name: name,
                url: downloadURL,
                timestamp: new Date()
            });

            status.textContent = "Erfolg! Lade Seite neu...";
            setTimeout(() => location.reload(), 1500);
        } catch (e) {
            console.error(e);
            status.textContent = "Fehler!";
        }
    };

    loadItems();
</script>

</body>
</html>
