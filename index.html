<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Rater 1-10</title>
    <style>
        /* (Gleiches Styling wie vorher) */
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        #app-container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        #image-container { width: 100%; height: 250px; border-radius: 10px; overflow: hidden; margin-bottom: 1.5rem; background-color: #eee; }
        #item-image { width: 100%; height: 100%; object-fit: cover; }
        .controls { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .slider-container { flex-grow: 1; display: flex; flex-direction: column; }
        input[type=range] { width: 100%; cursor: pointer; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="rater-box">
        <h2 id="item-name">Lade...</h2>
        <div id="image-container"><img id="item-image" src="" alt=""></div>
        <div class="controls">
            <div class="slider-container">
                <input type="range" id="rating-slider" min="1" max="10" value="5">
                <div style="display:flex; justify-content:space-between; font-size: 0.8rem;">
                    <span>1</span> <span id="current-val">Wert: 5</span> <span>10</span>
                </div>
            </div>
            <button id="submit-btn">Senden</button>
        </div>
    </div>
    <div id="finish-message" class="hidden">
        <h2>Danke!</h2>
        <p>Alle Bewertungen wurden in der Cloud gespeichert.</p>
        <button onclick="location.reload()">Nochmal?</button>
    </div>
</div>

<script type="module">
    // Firebase SDKs importieren
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // HIER DEINE FIREBASE CONFIG EINFÜGEN!
    const firebaseConfig = {
        apiKey: "DEIN_API_KEY",
        authDomain: "DEIN_PROJEKT.firebaseapp.com",
        projectId: "DEIN_PROJEKT_ID",
        storageBucket: "DEIN_PROJEKT.appspot.com",
        messagingSenderId: "DEINE_ID",
        appId: "DEINE_APP_ID"
    };

    // Firebase initialisieren
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const items = [
        { name: "Pizza Hawaii", img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500" },
        { name: "Hausaufgaben", img: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=500" },
        { name: "Wochenende", img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500" }
    ];

    let currentIndex = 0;
    const slider = document.getElementById('rating-slider');
    const valDisplay = document.getElementById('current-val');

    slider.oninput = () => valDisplay.textContent = `Wert: ${slider.value}`;

    function updateUI() {
        if (currentIndex < items.length) {
            document.getElementById('item-name').textContent = items[currentIndex].name;
            document.getElementById('item-image').src = items[currentIndex].img;
            slider.value = 5;
            valDisplay.textContent = "Wert: 5";
        } else {
            document.getElementById('rater-box').classList.add('hidden');
            document.getElementById('finish-message').classList.remove('hidden');
        }
    }

    document.getElementById('submit-btn').onclick = async () => {
        const ratingValue = parseInt(slider.value);
        const itemName = items[currentIndex].name;

        try {
            // Daten in Firestore speichern
            await addDoc(collection(db, "bewertungen"), {
                item: itemName,
                rating: ratingValue,
                timestamp: serverTimestamp()
            });
            
            console.log("Gespeichert!");
            currentIndex++;
            updateUI();
        } catch (e) {
            console.error("Fehler beim Speichern: ", e);
            alert("Fehler beim Speichern der Daten.");
        }
    };

    updateUI();
</script>

</body>
</html>
